<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onet | 話せる場所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#070707;
    --panel:#0d0d0d;
    --gold:#b9924f;
    --gold-soft:rgba(185,146,79,0.5);
    --ink:#f4f1ea;
    --ink-dim:#a8a49a;
    --line:rgba(244,241,234,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
  }
  a{color:inherit;}

  /* ================= HERO ================= */
  .hero{
    position:relative;
    min-height:100svh;
    overflow:hidden;
    background:var(--black);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 24px 100px;
  }

  /* dotted texture, echoing the mark's own dot ring */
  .dots{
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(244,241,234,0.09) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 42%, black 0%, transparent 72%);
    mask-image:radial-gradient(ellipse 70% 65% at 50% 42%, black 0%, transparent 72%);
    opacity:.9;
  }
  .glow{
    position:absolute;left:50%;top:38%;
    width:900px;height:900px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(185,146,79,0.16), transparent 62%);
    pointer-events:none;
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, transparent 55%, rgba(0,0,0,0.85) 100%);
    pointer-events:none;
  }

  .hero-content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }

  .mark{
    width:168px;height:168px;border-radius:50%;
    box-shadow:0 18px 50px -10px rgba(0,0,0,0.75), 0 0 0 1px rgba(244,241,234,0.06);
    margin-bottom:52px;
  }

  .rule{
    width:34px;height:1px;background:var(--gold);
    margin-bottom:34px;
  }

  .headline{
    font-family:'Shippori Mincho',serif;
    font-weight:500;
    font-size:clamp(1.5rem,3.3vw,2.35rem);
    letter-spacing:.06em;
    line-height:2;
    max-width:19ch;
    color:var(--ink);
  }

  .sub-jp{
    margin-top:26px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.05rem,2vw,1.35rem);
    letter-spacing:.04em;
    line-height:1.9;
    max-width:24ch;
    color:var(--gold);
  }

  /* ================= CONTACT ================= */
  .contact{
    background:var(--black);
    padding:110px 24px 130px;
    text-align:center;
    border-top:1px solid var(--line);
  }
  .contact h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-size:clamp(2.2rem,5vw,3.4rem);
    color:#9b98a4;
    letter-spacing:.02em;
  }
  .divider{
    width:46px;height:1px;background:var(--line);
    margin:26px auto 34px;
  }
  .contact .lead{
    font-family:'Shippori Mincho',serif;
    font-size:1.15rem;color:var(--ink);
    margin-bottom:52px;
  }
  form{max-width:720px;margin:0 auto;text-align:left;}
  .field{
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    font-size:.95rem;
    padding:18px 20px;
    margin-bottom:22px;
    border-radius:2px;
  }
  .field::placeholder{color:var(--ink-dim);}
  textarea.field{min-height:180px;resize:vertical;}
  .field:focus{outline:none;border-color:var(--gold);}
  .agree{
    display:flex;align-items:flex-start;gap:10px;
    font-size:.85rem;color:var(--ink-dim);
    margin-bottom:40px;
  }
  .agree input{margin-top:3px;accent-color:var(--gold);}
  .send-row{text-align:center;}
  .send-btn{
    background:var(--gold);color:#0a0a0a;
    font-weight:700;font-size:.82rem;letter-spacing:.18em;
    padding:16px 46px;border:none;border-radius:2px;
    cursor:pointer;transition:opacity .25s ease;
  }
  .send-btn:hover{opacity:.85;}

  footer{
    text-align:center;padding:36px 20px;
    color:#4a4854;font-size:.7rem;letter-spacing:.1em;
    background:var(--black);
  }
</style>
</head>
